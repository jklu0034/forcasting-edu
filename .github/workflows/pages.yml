name: Deploy site to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # site/ is committed so it can be copied to any static host as-is;
      # fail if someone edited design/ or the build without rebuilding.
      - name: Check site/ is up to date with design/
        run: |
          npm run build
          git diff --exit-code -- site tailwind
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only the default branch publishes; other branches just run the check.
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
